name: ci

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --html=reporte.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-html
          path: reporte.html
